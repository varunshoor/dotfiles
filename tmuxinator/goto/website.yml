# /Users/varunshoor/.config/tmuxinator/goto/website.yml

name: goto/website
root: ~/bottomline/goto/website

windows:
  - nvim:
      layout: 2644,231x66,0,0[231x57,0,0,103,231x8,0,58,104]
      panes:
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "nvim" && nvim
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "shell"
  - console: tmux set-option -p -t "$TMUX_PANE" @pane_name "console"
  - git: tmux set-option -p -t "$TMUX_PANE" @pane_name "lazygit" && lazygit
  - servers:
      layout: even-vertical
      panes:
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "slicemachine" && pnpm slicemachine
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "dev" && pnpm dev
