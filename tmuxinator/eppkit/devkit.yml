# /Users/varunshoor/.config/tmuxinator/eppkit/devkit.yml

name: eppkit/devkit
root: ~/bottomline/eppkit/devkit

windows:
  - nvim:
      layout: 9bfd,231x68,0,0[231x52,0,0,122,231x15,0,53{75x15,0,53,126,80x15,76,53,127,74x15,157,53,128}]
      panes:
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "nvim" && nvim
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "claude" && claude
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "shell"
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "shell"
  - server: tmux set-option -p -t "$TMUX_PANE" @pane_name "server" && make dev
  - git: tmux set-option -p -t "$TMUX_PANE" @pane_name "lazygit" && lazygit
