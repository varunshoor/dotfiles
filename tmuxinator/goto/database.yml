# /Users/varunshoor/.config/tmuxinator/goto/database.yml

name: goto/database
root: ~/bottomline/goto/database

windows:
  - nvim:
      layout: 2644,231x66,0,0[231x57,0,0,103,231x8,0,58,104]
      panes:
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "nvim" && nvim
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "shell"
  - console: tmux set-option -p -t "$TMUX_PANE" @pane_name "console"
  - git: tmux set-option -p -t "$TMUX_PANE" @pane_name "lazygit" && lazygit
  - production: tmux set-option -p -t "$TMUX_PANE" @pane_name "production" && harlequin --theme tango -a postgres $DB_URL
  - local: tmux set-option -p -t "$TMUX_PANE" @pane_name "local" && harlequin --theme tango -a postgres $DB_URL_DEV
