# /Users/varunshoor/.config/tmuxinator/goto/gto-worker.yml

name: goto/gto-worker
root: ~/bottomline/goto/gto-worker

windows:
  - nvim:
      layout: 9929,231x66,0,0[231x57,0,0,27,231x8,0,58{104x8,0,58,30,70x8,105,58,33,55x8,176,58,31}]
      panes:
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "nvim" && nvim
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "shell"
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "dev" && pnpm run dev
        - tmux set-option -p -t "$TMUX_PANE" @pane_name "tests" && pnpm test:coverage
  - console: tmux set-option -p -t "$TMUX_PANE" @pane_name "console"
  - git: tmux set-option -p -t "$TMUX_PANE" @pane_name "lazygit" && lazygit
